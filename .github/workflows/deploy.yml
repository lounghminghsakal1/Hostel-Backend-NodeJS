# Deploys the backend to EC2: GitHub > Actions > "Deploy to EC2" > Run workflow.
# Runs the same scripts/deploy/remote-deploy.sh as `npm run deploy`.
#
# One-time setup (repo Settings > Secrets and variables > Actions):
#   Secrets:   EC2_HOST (public IP/DNS), EC2_SSH_KEY (the whole .pem file contents), EC2_USER (optional, default ubuntu)
#   Variables: APP_DIR, PM2_APP (optional; defaults below)
# The EC2 security group must allow SSH (port 22) from GitHub's runners for this to connect.
name: Deploy to EC2

on:
  workflow_dispatch:
  # To deploy automatically on every push to main, uncomment:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the deploy script
        uses: actions/checkout@v4

      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          APP_DIR: ${{ vars.APP_DIR || '/home/ubuntu/Hostel-Backend-NodeJS' }}
          PM2_APP: ${{ vars.PM2_APP || 'hostel-backend' }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Add the EC2_HOST and EC2_SSH_KEY repository secrets first."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh -i ~/.ssh/ec2.pem \
            -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ConnectTimeout=15 \
            "${EC2_USER:-ubuntu}@$EC2_HOST" \
            "bash -s -- '$APP_DIR' '$PM2_APP' '${{ github.ref_name }}' 2471" < scripts/deploy/remote-deploy.sh

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/ec2.pem
